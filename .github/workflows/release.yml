name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build playstore release APK + AAB
        run: ./gradlew assemblePlaystoreRelease bundlePlaystoreRelease --no-daemon

      - name: Upload playstore release APK
        uses: actions/upload-artifact@v4
        with:
          name: ping-playstore-release-apk
          path: app/build/outputs/apk/playstore/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload playstore release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ping-playstore-release-aab
          path: app/build/outputs/bundle/playstore/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/playstore/release/*.apk
            app/build/outputs/bundle/playstore/release/*.aab
