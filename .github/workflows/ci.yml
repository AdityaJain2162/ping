name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Both Flavors
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build community debug APK (ad-free)
        run: ./gradlew assembleCommunityDebug --no-daemon

      - name: Build playstore debug APK (with ads)
        run: ./gradlew assemblePlaystoreDebug --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintCommunityDebug --no-daemon
        continue-on-error: true

      - name: Upload community APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ping-community-debug-apk
          path: app/build/outputs/apk/community/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload playstore APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ping-playstore-debug-apk
          path: app/build/outputs/apk/playstore/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: warn
